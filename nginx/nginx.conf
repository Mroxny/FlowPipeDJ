server {
    listen 80;
    
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }
}